server:
  port: 8567
  servlet:
    context-path: /api

spring:
  application:
    name: ai-content-creation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_content_creation
    username: root
    password: root

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.caoerlin.aicontentcreation.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.mapper
  type-aliases-package: com.caoerlin.aicontentcreation.model.dto.user
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局逻辑删除的字段名
      logic-delete-field: is_delete
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0